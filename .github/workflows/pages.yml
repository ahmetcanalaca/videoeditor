name: Web edition (GitHub Pages)

# Builds the static web edition in web/ and publishes it with GitHub Pages.
# Every action is pinned to a commit (the tag is in the comment); Dependabot proposes updates (see ../dependabot.yml).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      # the web edition bundles code of the desktop app: a change there must be regenerated (sync-desktop --check fails otherwise)
      - 'src/shared/**'
      - 'src/main/ai/**'
      - 'src/main/perception/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# Only deployments are serialized (see the deploy job): a slow or stuck test job must never hold up the publication of the next change.

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Vendored libraries are exactly the pinned ones
        working-directory: web
        run: node scripts/vendor.js verify
      - name: The copies of the desktop code are current
        working-directory: web
        run: node scripts/sync-desktop.js --check
      - name: Audio DSP, assistant core, in-browser assistant (catalogue, checked downloads, requests), vendored libraries (declared patches) and browser extension (rules, manifest, package) unit tests
        working-directory: web
        run: node tests/audio-dsp.test.js && node tests/ai-core.test.js && node tests/ib-core.test.js && node tests/vendor.test.js && node tests/ext-policy.test.js
      - name: Build the site
        working-directory: web
        run: node scripts/build.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/_site

  deploy:
    name: Deploy
    needs: build
    # only the main branch is ever published (a manual run from another branch builds but does not deploy)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
