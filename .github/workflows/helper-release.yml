name: Local AI helper release

# Publishes the zip of the Local AI helper (web/local-ai/) as a GitHub release: its SHA-256 in the notes and a signed build attestation (Sigstore, through
# GitHub), as a fixed, archived copy. The pack is reproducible (the same sources give the same bytes), so for the same commit this zip is byte-identical to
# the one on the web page; the zip on the page is attested by the workflow that publishes the site (pages.yml), so a release is not needed to check it:
#   gh attestation verify VideoEditor-LocalAI.zip --repo <owner>/<repo> --signer-workflow <owner>/<repo>/.github/workflows/helper-release.yml --source-ref refs/heads/main
# Run it by hand (Actions > Local AI helper release > Run workflow) when a copy is wanted. Every action is pinned to a commit.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example local-ai-v4.0.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Pack, attest and publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # creates the release
      id-token: write # signs the attestation
      attestations: write # stores the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: The generated files are current
        working-directory: web
        run: node scripts/sync-desktop.js --check
      - name: Pack the helper
        working-directory: web
        run: node scripts/local-ai-pack.js --out "$RUNNER_TEMP/pack"
      - name: Attest where the zip was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/pack/local-ai/VideoEditor-LocalAI.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            local-ai-v*) ;;
            *) echo "The tag has to start with local-ai-v"; exit 1 ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^local-ai-v[0-9A-Za-z._-]{1,40}$'; then echo "Unusual characters in the tag"; exit 1; fi
          dir="$RUNNER_TEMP/pack/local-ai"
          sha=$(sha256sum "$dir/VideoEditor-LocalAI.zip" | cut -d' ' -f1)
          {
            echo "SHA-256 of VideoEditor-LocalAI.zip:"
            echo
            echo '```'
            echo "$sha"
            echo '```'
            echo
            echo "Built by this repository's workflow from commit $GITHUB_SHA. The pack is reproducible: the zip on the web page has the same SHA-256 when it was built from the same commit (after later changes of web/local-ai/ it legitimately differs; the page's zip is attested by the workflow that publishes the site, see SECURITY.md)."
            echo
            echo "Check where the file was built (needs the GitHub CLI):"
            echo
            echo '```'
            echo "gh attestation verify VideoEditor-LocalAI.zip --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/helper-release.yml --source-ref refs/heads/main"
            echo '```'
            echo
            echo "The script is not signed with a code-signing certificate: you trust this repository and GitHub. Read web/local-ai/local-ai.ps1 before you run it."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$dir/VideoEditor-LocalAI.zip" "$dir/info.json" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Local AI helper ($TAG)" --notes-file "$RUNNER_TEMP/notes.md"
